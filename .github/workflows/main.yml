name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - run: npm ci
    - run: npm run lint --if-present
    - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - run: npm ci
    - run: npm run lint
    - run: npm run build

  e2e-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install dependencies
      run: |
        cd backend && npm ci
        cd ../frontend && npm ci
    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps chromium
    - name: Run E2E Tests
      env:
        MONGODB_URI: mongodb://127.0.0.1:27017/orders-app-e2e
      run: |
        cd backend && npm run dev &
        cd frontend && npm run dev &
        npx wait-on tcp:5000 tcp:3000
        cd frontend && npx playwright test
